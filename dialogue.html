<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>對話區｜越南語學習室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --green:#1F4A3D; --green-2:#2F6B58; --cream:#F6F2E8; --paper:#FBF8F1; --card:#FFFDF8;
  --ink:#1E2B26; --muted:#5B6B63; --gold:#D8A93A; --line:rgba(31,74,61,.13);
  --tint:#EEF3EA; --bad:#B5402C;
  --serif:"Noto Serif TC",Georgia,serif; --sans:"Noto Sans TC","Be Vietnam Pro",system-ui,sans-serif;
  --viet:"Be Vietnam Pro","Noto Sans TC",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);line-height:1.7}
button{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}

/* 頂部導覽（與其他頁面一致） */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding:12px clamp(16px,3vw,40px);background:rgba(251,248,241,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand::before{content:"";flex:none;width:52px;height:42px;background:url("logo-cat.png") center/contain no-repeat;mix-blend-mode:multiply}
.brand strong{display:block;font-family:var(--serif);font-size:1.12rem;color:var(--green);line-height:1.2}
.brand small{display:block;font-size:.7rem;color:var(--muted);letter-spacing:.06em}
nav.menu{display:flex;gap:4px;flex-wrap:wrap}
nav.menu a{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;font-size:.95rem;position:relative}
nav.menu a svg{width:18px;height:18px}
nav.menu a:hover{background:rgba(31,74,61,.06)}
nav.menu a[aria-current="page"]{color:var(--green);font-weight:500}
nav.menu a[aria-current="page"]::after{content:"";position:absolute;left:12px;right:12px;bottom:-4px;height:2px;background:var(--green)}

.wrap{max-width:860px;margin:0 auto;padding:26px clamp(16px,4vw,40px) 64px}
.crumbs{font-size:.9rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumbs a:hover{color:var(--green)}

/* 橫幅 */
.banner{position:relative;overflow:hidden;border-radius:20px;margin:12px 0 24px;padding:26px 30px;min-height:150px;
  background:linear-gradient(100deg,#F4EFE0 0%,#EADFC6 100%);display:flex;align-items:center}
.banner h1{font-family:var(--serif);font-size:clamp(1.7rem,3.4vw,2.2rem);color:var(--green);margin:0;line-height:1.25;position:relative;z-index:2}
.banner .vi-sub{display:block;font-size:.85rem;letter-spacing:.08em;color:var(--muted);margin:4px 0 6px;position:relative;z-index:2}
.banner p{margin:0;max-width:46ch;position:relative;z-index:2}
.banner .cat{position:absolute;right:-6px;bottom:-6px;height:150%;max-height:190px;width:auto;z-index:1}

/* 情境列表 */
.scenes{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.sc{display:flex;flex-direction:column;gap:8px;padding:22px;border-radius:20px;background:#E3EFE4;box-shadow:0 10px 24px rgba(31,74,61,.06);transition:transform .2s}
.sc:hover{transform:translateY(-3px)}
.sc .tag{align-self:flex-start;font-size:.8rem;background:rgba(255,255,255,.7);color:var(--green);padding:2px 10px;border-radius:999px}
.sc .t{font-family:var(--serif);font-size:1.25rem;color:var(--green);font-weight:600}
.sc .d{font-size:.92rem;color:var(--muted);margin:0}
.sc .f{margin-top:auto;font-size:.88rem;color:var(--green)}
.sc.soon{background:var(--paper);border:1px dashed var(--line);box-shadow:none}
.sc.soon .f{color:var(--muted)}

/* 對話區 */
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.toggle{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:7px 16px;cursor:pointer;font-size:.92rem;color:var(--muted)}
.toggle[aria-pressed="true"]{background:var(--green);color:var(--cream);border-color:var(--green)}
.chat{display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:20px;background:var(--card);border:1px solid var(--line);min-height:240px}
.msg{display:flex;flex-direction:column;max-width:78%;gap:4px}
.msg.staff{align-self:flex-start}
.msg.me{align-self:flex-end;align-items:flex-end}
.bubble{padding:11px 16px;border-radius:18px;font-family:var(--viet);font-size:1.05rem;line-height:1.5}
.msg.staff .bubble{background:var(--tint);border-bottom-left-radius:6px}
.msg.me .bubble{background:var(--green);color:var(--cream);border-bottom-right-radius:6px}
.msg .zh{font-size:.9rem;color:var(--muted);padding:0 6px;display:none}
.msg .zh.show{display:block}
.who{font-size:.8rem;color:var(--muted);padding:0 6px}
.speak{width:30px;height:30px;border-radius:50%;border:0;background:rgba(31,74,61,.1);color:var(--green);cursor:pointer;display:inline-grid;place-items:center;vertical-align:middle;margin-left:6px;flex:none}
.msg.me .speak{background:rgba(255,255,255,.2);color:var(--cream)}
.speak:hover{background:var(--green);color:var(--cream)}
.speak svg{width:14px;height:14px}

/* 選項 */
.panel{margin-top:16px;padding:18px;border-radius:20px;background:var(--paper);border:1px solid var(--line)}
.panel .prompt{font-size:.9rem;color:var(--muted);margin:0 0 10px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;padding:12px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-family:var(--viet);font-size:1rem}
.opt:hover{border-color:var(--green-2)}
.opt:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.opt.wrong{border-color:var(--bad);background:#F8E9E5;cursor:default}
.opt.wrong:hover{border-color:var(--bad)}
.opt .speak{margin-left:0}
.feedback{margin:12px 0 0;font-size:.95rem;color:var(--ink);min-height:1.5em}
.feedback.bad{color:var(--bad)}
.feedback.good{color:var(--green-2)}

/* 結果 */
.result{text-align:center;padding:34px 20px}
.result h2{font-family:var(--serif);color:var(--green);font-size:1.8rem;margin:0 0 8px}
.result p{color:var(--muted);margin:6px 0}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.btn{background:var(--green);color:var(--cream);border:0;border-radius:999px;padding:10px 22px;cursor:pointer;font-size:.95rem}
.btn.ghost{background:none;color:var(--green);border:1px solid var(--green)}
.back{display:inline-flex;margin-top:24px;color:var(--green);font-size:.95rem}
.back:hover{text-decoration:underline}

footer{padding:18px;text-align:center;color:var(--muted);font-size:.88rem;border-top:1px solid var(--line)}

@media (max-width:640px){
  nav.menu{width:100%;justify-content:space-between}
  nav.menu a{padding:6px 6px;font-size:.85rem}
  nav.menu a svg{display:none}
  .msg{max-width:92%}
  .banner .cat{opacity:.5}
}
</style>
</head>
<body>

<header class="top">
  <a class="brand" href="index.html" aria-label="越南語學習室首頁">
    <span><strong>越南語學習室</strong><small>Học tiếng Việt</small></span>
  </a>
  <nav class="menu" aria-label="主選單">
    <a href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>首頁
    </a>
    <a href="vocab.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2zM22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"/></svg>單字區
    </a>
    <a href="dialogue.html" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12z"/></svg>對話區
    </a>
    <a href="reading.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>閱讀區
    </a>
  </nav>
</header>

<main class="wrap">
  <nav class="crumbs" id="crumbs" aria-label="目前位置"></nav>
  <section class="banner" id="banner"></section>
  <div id="view"></div>
</main>

<footer>情境與對話可在程式中自行增加。</footer>

<script>
/* ================= 情境資料 ================= */
/* who: "staff" 為店員的話（自動顯示）；"me" 為學習者要選擇的回應
   每個選項：vi 越南文、zh 中文、ok 是否正確、why 越南文說明（錯誤時顯示） */
const SCENARIOS = [
  {
    id: "nha-hang", level: "A1", topic: "飲食", title: "在餐廳點餐",
    desc: "你走進越南餐廳，點一碗河粉和一杯飲料，然後結帳道謝。",
    steps: [
      { who: "staff", vi: "Xin chào! Anh/chị ăn gì ạ?", zh: "您好！請問您要吃什麼？" },
      { who: "me", opts: [
        { vi: "Cho tôi một tô phở bò.", zh: "請給我一碗牛肉河粉。", ok: true, why: "Đúng rồi! Đây là cách gọi món đơn giản nhất." },
        { vi: "Xin chào, tạm biệt.", zh: "你好，再見。", ok: false, why: "Lúc này nhân viên đang hỏi bạn muốn ăn gì, chưa phải lúc chào tạm biệt." },
        { vi: "Cảm ơn, không có gì.", zh: "謝謝，不客氣。", ok: false, why: "Câu này dùng để đáp lại lời cảm ơn, nhưng nhân viên vừa hỏi bạn muốn ăn gì." }
      ] },
      { who: "staff", vi: "Dạ, anh/chị uống gì ạ?", zh: "好的，請問您要喝什麼？" },
      { who: "me", opts: [
        { vi: "Cho tôi một ly cà phê sữa đá.", zh: "請給我一杯冰奶咖啡。", ok: true, why: "Đúng rồi! Cho tôi một ly … dùng để gọi đồ uống." },
        { vi: "Tôi không ăn thịt bò.", zh: "我不吃牛肉。", ok: false, why: "Câu này nói về món ăn, nhưng nhân viên đang hỏi về đồ uống." },
        { vi: "Xin lỗi, tôi đến muộn.", zh: "對不起，我來晚了。", ok: false, why: "Câu này là lời xin lỗi, chưa phù hợp ở đây." }
      ] },
      { who: "staff", vi: "Anh/chị có muốn thêm gì không?", zh: "您還要加點什麼嗎？" },
      { who: "me", opts: [
        { vi: "Không, cảm ơn.", zh: "不用了，謝謝。", ok: true, why: "Đúng rồi! Không, cảm ơn dùng để từ chối một cách lịch sự." },
        { vi: "Không có gì.", zh: "不客氣。", ok: false, why: "Không có gì là lời đáp cho lời cảm ơn, không phải câu trả lời cho câu hỏi này." },
        { vi: "Tạm biệt!", zh: "再見！", ok: false, why: "Tạm biệt dùng khi rời đi, bây giờ bạn vẫn đang ăn." }
      ] },
      { who: "staff", vi: "Dạ, anh/chị chờ một chút nhé!", zh: "好的，請您稍等一下！" },
      { who: "staff", vi: "Cảm ơn anh/chị. Chúc anh/chị ngon miệng!", zh: "謝謝您。祝您用餐愉快！" },
      { who: "me", opts: [
        { vi: "Cảm ơn anh/chị!", zh: "謝謝您！", ok: true, why: "Đúng rồi! Đây là cách đáp lại lời chúc của nhân viên." },
        { vi: "Chúc bạn ngủ ngon.", zh: "祝你晚安。", ok: false, why: "Chúc bạn ngủ ngon dùng vào buổi tối trước khi đi ngủ." },
        { vi: "Xin lỗi!", zh: "對不起！", ok: false, why: "Xin lỗi dùng khi làm sai điều gì đó, ở đây không cần." }
      ] }
    ]
  }
];

/* ================= 工具 ================= */
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
const SPEAK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>';

/* ================= 發音（先播放音檔，沒有音檔時改用系統語音） ================= */
const canSpeak = "speechSynthesis" in window;
let viVoice = null;
function pickVoice() {
  if (!canSpeak) return;
  const voices = speechSynthesis.getVoices();
  if (!voices.length) return;
  viVoice = voices.find(v => /^vi[-_]/i.test(v.lang)) || voices.find(v => /viet/i.test(v.name)) || null;
}
if (canSpeak) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function fileName(text) {
  return text.normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/đ/g, "d").replace(/Đ/g, "D")
    .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") + ".mp3";
}
function speakSystem(text) {
  if (!canSpeak) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "vi-VN";
  if (viVoice) u.voice = viVoice;
  u.rate = 0.85;
  speechSynthesis.speak(u);
}
let autoPlay = true;   // 自動播放開關
let tokenSeq = 0;      // 每次開啟情境都會換新編號，用來停止舊的播放流程
let flowAudio = null;

// 用系統語音播放一句，播完才回呼（避免流程卡住，設定逾時保護）
function systemSpeak(text, done) {
  if (!canSpeak) { done(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "vi-VN";
  if (viVoice) u.voice = viVoice;
  u.rate = 0.85;
  u.onend = done;
  u.onerror = done;
  speechSynthesis.speak(u);
  setTimeout(done, 10000);
}

// 播放一句並等它結束（自動播放流程使用）
function playLine(text) {
  return new Promise(resolve => {
    if (flowAudio) { flowAudio.pause(); flowAudio = null; }
    if (canSpeak) speechSynthesis.cancel();
    let finished = false;
    const done = () => { if (!finished) { finished = true; resolve(); } };
    const a = new Audio("audio/dialogue/" + fileName(text));
    flowAudio = a;
    a.onended = done;
    a.onerror = () => systemSpeak(text, done);
    a.play().catch(() => systemSpeak(text, done));
    setTimeout(done, 10000);
  });
}

// 點喇叭手動播放（不影響自動播放流程）
function speak(text) {
  const a = new Audio("audio/dialogue/" + fileName(text));
  a.onerror = () => speakSystem(text);
  a.play().catch(() => speakSystem(text));
}
function speakBtn(text) {
  const b = el("button", "speak");
  b.setAttribute("aria-label", "播放發音");
  b.innerHTML = SPEAK_ICON;
  b.addEventListener("click", e => { e.stopPropagation(); speak(text); });
  return b;
}

/* ================= 版面 ================= */
function setHead(crumbItems, title, viSub, desc) {
  const c = $("crumbs"); c.innerHTML = "";
  crumbItems.forEach((item, i) => {
    if (i > 0) c.append(el("span", null, "›"));
    if (item.href) { const a = el("a", null, item.text); a.href = item.href; c.append(a); }
    else c.append(el("span", null, item.text));
  });
  const b = $("banner"); b.innerHTML = "";
  const text = el("div");
  text.append(el("h1", null, title));
  if (viSub) text.append(el("span", "vi-sub", viSub));
  if (desc) text.append(el("p", null, desc));
  b.append(text);
  const img = document.createElement("img");
  img.className = "cat"; img.src = "banner-cat.png"; img.alt = ""; img.setAttribute("aria-hidden", "true");
  b.append(img);
}

/* ================= 頁面一：情境列表 ================= */
function showList() {
  setHead([{ text: "對話區" }], "對話區", "Hội thoại", "選一個生活情境，依照情境選擇正確的回應。");
  const view = $("view"); view.innerHTML = "";
  const grid = el("div", "scenes");
  SCENARIOS.forEach(s => {
    const card = el("a", "sc");
    card.href = "#/" + s.id;
    card.append(el("span", "tag", s.level + "　" + s.topic), el("span", "t", s.title), el("p", "d", s.desc), el("span", "f", "開始練習 →"));
    grid.append(card);
  });
  const soon = el("div", "sc soon");
  soon.append(el("span", "t", "更多情境"), el("p", "d", "例如問路、搭計程車、買東西，即將推出。"), el("span", "f", "即將推出"));
  grid.append(soon);
  view.append(grid);
}

/* ================= 頁面二：對話 ================= */
let run = null; // 目前這一次練習的狀態

function showScenario(id) {
  const s = SCENARIOS.find(x => x.id === id);
  if (!s) { showList(); return; }
  setHead([{ text: "對話區", href: "#/" }, { text: s.title }], s.title, s.topic + "　·　" + s.level, s.desc);

  run = { s, ptr: 0, score: 0, total: s.steps.filter(st => st.who === "me").length, showZh: false, token: ++tokenSeq };

  const view = $("view"); view.innerHTML = "";
  const bar = el("div", "toolbar");
  const zhBtn = el("button", "toggle", "顯示中文");
  zhBtn.setAttribute("aria-pressed", "false");
  zhBtn.addEventListener("click", () => {
    run.showZh = !run.showZh;
    zhBtn.setAttribute("aria-pressed", String(run.showZh));
    zhBtn.textContent = run.showZh ? "隱藏中文" : "顯示中文";
    document.querySelectorAll(".msg .zh").forEach(z => z.classList.toggle("show", run.showZh));
  });
  const autoBtn = el("button", "toggle", autoPlay ? "自動播放：開" : "自動播放：關");
  autoBtn.setAttribute("aria-pressed", String(autoPlay));
  autoBtn.addEventListener("click", () => {
    autoPlay = !autoPlay;
    autoBtn.setAttribute("aria-pressed", String(autoPlay));
    autoBtn.textContent = autoPlay ? "自動播放：開" : "自動播放：關";
  });
  bar.append(el("span", null, "你扮演客人"), autoBtn, zhBtn);
  view.append(bar);

  const chat = el("div", "chat"); chat.id = "chat";
  const panel = el("div", "panel"); panel.id = "panel";
  view.append(chat, panel);

  const back = el("a", "back", "← 返回對話情境");
  back.href = "#/";
  view.append(back);

  playUntilChoice();
}

function addBubble(who, line) {
  const msg = el("div", "msg " + who);
  if (who === "staff") msg.append(el("span", "who", "店員"));
  const row = el("div");
  row.style.display = "flex";
  row.style.alignItems = "center";
  row.style.gap = "4px";
  const bubble = el("div", "bubble", line.vi);
  if (who === "me") { row.style.flexDirection = "row-reverse"; }
  row.append(bubble, speakBtn(line.vi));
  msg.append(row, el("div", "zh", line.zh));
  if (run.showZh) msg.querySelector(".zh").classList.add("show");
  $("chat").append(msg);
  $("chat").scrollTop = $("chat").scrollHeight;
}

async function playUntilChoice() {
  const token = run.token;
  const steps = run.s.steps;
  while (run.ptr < steps.length && steps[run.ptr].who === "staff") {
    const line = steps[run.ptr];
    addBubble("staff", line);
    run.ptr++;
    if (autoPlay) {
      await playLine(line.vi);
      if (token !== run.token) return;   // 已離開此情境
    }
  }
  if (token !== run.token) return;
  if (run.ptr >= steps.length) { showResult(); return; }
  renderOptions(steps[run.ptr]);
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderOptions(step) {
  const panel = $("panel");
  panel.innerHTML = "";
  panel.append(el("p", "prompt", "請選擇你的回應："));
  const list = el("div", "opts");
  const feedback = el("p", "feedback");
  let attempts = 0;

  shuffle(step.opts).forEach(opt => {
    const row = el("div", "opt");
    row.setAttribute("role", "button");
    row.tabIndex = 0;
    row.append(el("span", null, opt.vi), speakBtn(opt.vi));
    row.addEventListener("click", () => {
      if (row.classList.contains("wrong")) return;
      if (opt.ok) {
        if (attempts === 0) run.score++;
        feedback.className = "feedback good";
        feedback.textContent = opt.why;
        addBubble("me", opt);
        run.ptr++;
        if (autoPlay) {
          const token = run.token;
          playLine(opt.vi).then(() => { if (token === run.token) setTimeout(playUntilChoice, 300); });
        } else {
          setTimeout(playUntilChoice, 500);
        }
      } else {
        attempts++;
        row.classList.add("wrong");
        feedback.className = "feedback bad";
        feedback.textContent = opt.why;
      }
    });
    list.append(row);
  });
  panel.append(list, feedback);
}

function showResult() {
  const panel = $("panel");
  panel.innerHTML = "";
  const box = el("div", "result");
  box.append(el("h2", null, "Hoàn thành!"));
  box.append(el("p", null, `第一次就選對：${run.score} / ${run.total}`));
  const btns = el("div", "btns");
  const again = el("button", "btn", "再練習一次");
  again.addEventListener("click", () => showScenario(run.s.id));
  const list = el("a", "btn ghost", "返回情境列表");
  list.href = "#/";
  btns.append(again, list);
  box.append(btns);
  panel.append(box);
}

/* ================= 路由 ================= */
function route() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  if (parts[0] && SCENARIOS.some(s => s.id === parts[0])) showScenario(parts[0]);
  else showList();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
