<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>單字區｜越南語學習室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --green:#1F4A3D; --green-2:#2F6B58; --cream:#F6F2E8; --paper:#FBF8F1; --card:#FFFDF8;
  --ink:#1E2B26; --muted:#5B6B63; --gold:#D8A93A; --line:rgba(31,74,61,.13);
  --tint:#EEF3EA;
  --serif:"Noto Serif TC",Georgia,serif; --sans:"Noto Sans TC","Be Vietnam Pro",system-ui,sans-serif;
  --viet:"Be Vietnam Pro","Noto Sans TC",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);line-height:1.6}
button{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}

/* 頂部導覽 */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding:12px clamp(16px,3vw,40px);background:rgba(251,248,241,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand::before{content:"";flex:none;width:52px;height:42px;background:url("logo-cat.png") center/contain no-repeat;mix-blend-mode:multiply}
.brand strong{display:block;font-family:var(--serif);font-size:1.12rem;color:var(--green);line-height:1.2}
.brand small{display:block;font-size:.7rem;color:var(--muted);letter-spacing:.06em}
nav.menu{display:flex;gap:4px;flex-wrap:wrap}
nav.menu a{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;font-size:.95rem;position:relative}
nav.menu a svg{width:18px;height:18px}
nav.menu a:hover{background:rgba(31,74,61,.06)}
nav.menu a[aria-current="page"]{color:var(--green);font-weight:500}
nav.menu a[aria-current="page"]::after{content:"";position:absolute;left:12px;right:12px;bottom:-4px;height:2px;background:var(--green)}

/* 版面 */
.app{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 70px)}
.side{padding:20px 18px 40px;border-right:1px solid var(--line);background:rgba(246,242,232,.6)}
.back{display:inline-flex;gap:6px;align-items:center;color:var(--ink);font-size:.95rem;padding:6px 4px;margin-bottom:12px}
.back:hover{color:var(--green)}
.all-btn{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:0;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--ink);font-size:.95rem;margin-bottom:6px}
.all-btn:hover{background:rgba(31,74,61,.05)}
.all-btn[aria-current="true"]{background:var(--paper);box-shadow:0 1px 0 var(--line);color:var(--green);font-weight:500}
.grp{width:100%;display:flex;align-items:center;gap:10px;padding:12px 12px;border-radius:12px;border:0;background:var(--tint);cursor:pointer;margin-top:8px;text-align:left}
.grp.on{background:var(--green);color:var(--cream)}
.grp .ic{width:30px;text-align:center;font-size:1.2rem}
.grp .nm{flex:1;font-weight:500}
.grp .ct{font-size:.85rem;opacity:.75}
.subs{list-style:none;margin:6px 0 10px;padding:0 0 0 8px}
.sub{width:100%;display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:8px;border:0;background:none;cursor:pointer;font-size:.95rem;text-align:left;color:var(--ink)}
.sub:hover{background:rgba(31,74,61,.06)}
.sub[aria-current="true"]{background:var(--paper);box-shadow:0 1px 0 var(--line);color:var(--green);font-weight:500}
.sub .ct{font-size:.85rem;color:var(--muted)}

.main{padding:22px clamp(16px,3vw,40px) 40px;min-width:0}
.crumbs{font-size:.9rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.crumbs button{background:none;border:0;padding:0;cursor:pointer;color:var(--muted)}
.crumbs button:hover{color:var(--green)}

/* 橫幅 */
.banner{position:relative;overflow:hidden;border-radius:20px;margin:12px 0 22px;padding:28px 30px;min-height:170px;
  background:linear-gradient(100deg,#F4EFE0 0%,#EADFC6 100%);display:flex;align-items:center}
.banner h1{font-family:var(--serif);font-size:clamp(1.8rem,3.6vw,2.4rem);color:var(--green);margin:0;line-height:1.25;position:relative;z-index:2}
.banner .vi-sub{display:block;font-size:.85rem;letter-spacing:.08em;color:var(--muted);margin:4px 0 8px;position:relative;z-index:2}
.banner p{margin:0;color:var(--ink);max-width:44ch;position:relative;z-index:2}
.banner .cat{position:absolute;right:-6px;bottom:-6px;height:150%;max-height:210px;width:auto;z-index:1}

/* 搜尋 */
.toolbar{display:flex;justify-content:flex-end;margin-bottom:12px}
.search{width:min(320px,100%);font:inherit;font-size:.95rem;padding:9px 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink)}
#voiceNote{display:none;font-size:.9rem;color:var(--muted);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 14px}

/* 單字列表 */
.list{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:36px 64px minmax(190px,1fr) minmax(220px,1.4fr);gap:16px;align-items:center;
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;box-shadow:0 6px 16px rgba(31,74,61,.04)}
.idx{color:var(--muted);font-size:.9rem;text-align:center}
.thumb{width:64px;height:64px;border-radius:14px;background:var(--tint);display:grid;place-items:center;font-size:2rem}
.vi-line{display:flex;align-items:center;gap:8px}
.vi{font-family:var(--viet);font-size:1.3rem;font-weight:600;color:var(--green);line-height:1.25}
.pos{font-size:.92rem;color:var(--muted);margin-top:2px}
.ex{border-left:1px solid var(--line);padding-left:16px}
.ex .ev{font-family:var(--viet);color:var(--ink);display:block}
.ex .ez{font-size:.9rem;color:var(--muted);display:block}
.speak{flex:none;width:32px;height:32px;border-radius:50%;border:0;background:var(--tint);color:var(--green);cursor:pointer;display:grid;place-items:center}
.speak:hover{background:var(--green);color:var(--cream)}
.speak svg{width:16px;height:16px}
.empty{color:var(--muted);padding:30px 0;text-align:center}

/* 分頁 */
.pager{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:18px;font-size:.92rem;color:var(--muted)}
.pages{display:flex;gap:6px;align-items:center}
.pages button{min-width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--paper);cursor:pointer;color:var(--ink)}
.pages button[aria-current="true"]{background:var(--green);border-color:var(--green);color:var(--cream)}
.pages button:disabled{opacity:.4;cursor:default}
.pager select{font:inherit;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}

footer{padding:18px;text-align:center;color:var(--muted);font-size:.88rem;border-top:1px solid var(--line)}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{border-right:0;border-bottom:1px solid var(--line)}
  .row{grid-template-columns:64px 1fr;grid-template-areas:"thumb word" "thumb ex"}
  .idx{display:none}
  .thumb{grid-area:thumb}
  .row > div:nth-child(3){grid-area:word}
  .row > div:nth-child(4){grid-area:ex;border-left:0;padding-left:0}
  .banner .cat{opacity:.55}
}
@media (max-width:640px){
  nav.menu{width:100%;justify-content:space-between}
  nav.menu a{padding:6px 6px;font-size:.85rem}
  nav.menu a svg{display:none}
  .toolbar{justify-content:stretch}
  .search{width:100%}
}
</style>

  { g: "transport", s: "road", icon: "🚶", vi: "đi bộ", zh: "步行", pos: "(v)", ex: { vi: "Tôi thích đi bộ trong công viên.", zh: "我喜歡在公園散步。" } }

/* ================= 發音 ================= */
const canSpeak = "speechSynthesis" in window;
let viVoice = null;
function pickVoice() {
  if (!canSpeak) return;
  const voices = speechSynthesis.getVoices();
  if (!voices.length) return;
  viVoice = voices.find(v => /^vi[-_]/i.test(v.lang)) || voices.find(v => /viet/i.test(v.name)) || null;
}
if (canSpeak) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function audioName(text) {
  return text.normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/đ/g, "d").replace(/Đ/g, "D")
    .toLowerCase().trim().replace(/\s+/g, "-") + ".mp3";
}
function showVoiceNote() { const n = document.getElementById("voiceNote"); if (n && !viVoice) n.style.display = "block"; }
function speakSystem(text) {
  if (!canSpeak) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "vi-VN";
  if (viVoice) u.voice = viVoice;
  u.rate = 0.85;
  speechSynthesis.speak(u);
}
let currentAudio = null;
function speak(text) {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if (canSpeak) speechSynthesis.cancel();
  const a = new Audio("audio/" + audioName(text));
  currentAudio = a;
  const fallback = () => { showVoiceNote(); speakSystem(text); };
  a.onerror = fallback;
  a.play().catch(fallback);
}

/* ================= 狀態與工具 ================= */
const state = { grp: "all", sub: "all", kw: "", page: 1, size: 5 };
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
const findGroup = id => GROUPS.find(g => g.id === id);
const findSub = (gid, sid) => { const g = findGroup(gid); return g && g.subs.find(s => s.id === sid); };

function scopeWords() {
  return WORDS.filter(w => (state.grp === "all" || w.g === state.grp) && (state.sub === "all" || w.s === state.sub));
}
function visibleWords() {
  const kw = state.kw.trim().toLowerCase();
  return scopeWords().filter(w => !kw || (w.vi + " " + w.zh + " " + w.ex.vi + " " + w.ex.zh).toLowerCase().includes(kw));
}

/* ================= 渲染：側欄 ================= */
function navTo(grp, sub) {
  state.grp = grp; state.sub = sub; state.page = 1;
  renderAll();
}
function renderSide() {
  $("allCount").textContent = WORDS.length;
  const allBtn = $("allBtn");
  allBtn.setAttribute("aria-current", String(state.grp === "all"));
  allBtn.onclick = () => navTo("all", "all");
  const box = $("groups"); box.innerHTML = "";
  GROUPS.forEach(g => {
    const on = state.grp === g.id;
    const btn = el("button", "grp" + (on ? " on" : ""));
    btn.setAttribute("aria-expanded", String(on));
    btn.append(el("span", "ic", g.icon), el("span", "nm", g.name), el("span", "ct", String(WORDS.filter(w => w.g === g.id).length)));
    btn.addEventListener("click", () => navTo(g.id, "all"));
    box.append(btn);
    if (on) {
      const ul = el("ul", "subs");
      g.subs.forEach(s => {
        const li = el("li");
        const sb = el("button", "sub");
        sb.setAttribute("aria-current", String(state.sub === s.id));
        sb.append(el("span", null, s.name), el("span", "ct", String(WORDS.filter(w => w.s === s.id).length)));
        sb.addEventListener("click", () => navTo(g.id, s.id));
        li.append(sb);
        ul.append(li);
      });
      box.append(ul);
    }
  });
}

/* ================= 渲染：標題與麵包屑 ================= */
function renderHead() {
  const crumbs = $("crumbs"); crumbs.innerHTML = "";
  const home = el("button", null, "單字區");
  home.addEventListener("click", () => navTo("all", "all"));
  crumbs.append(home);
  let title = "全部單字", viSub = "Tất cả từ vựng", desc = "所有分類的單字，依生活主題慢慢累積。";
  if (state.grp !== "all") {
    const g = findGroup(state.grp);
    const gb = el("button", null, g.name);
    gb.addEventListener("click", () => navTo(g.id, "all"));
    crumbs.append(el("span", null, "›"), gb);
    title = g.name; viSub = g.vi; desc = g.desc;
    if (state.sub !== "all") {
      const s = findSub(g.id, state.sub);
      crumbs.append(el("span", null, "›"), el("span", null, s.name));
      title = s.name; viSub = s.vi;
    }
  }
  $("title").textContent = title;
  $("viSub").textContent = viSub;
  $("desc").textContent = desc;
}

/* ================= 渲染：單字列表 ================= */
const SPEAK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>';

function renderList() {
  const all = visibleWords();
  const pages = Math.max(1, Math.ceil(all.length / state.size));
  if (state.page > pages) state.page = pages;
  const start = (state.page - 1) * state.size;
  const slice = all.slice(start, start + state.size);

  const list = $("list"); list.innerHTML = "";
  if (!slice.length) list.append(el("p", "empty", "找不到符合的單字，換個關鍵字試試。"));

  slice.forEach((w, i) => {
    const row = el("div", "row");
    row.append(el("div", "idx", String(start + i + 1).padStart(2, "0")));
    row.append(el("div", "thumb", w.icon));

    const word = el("div", "word");
    const line = el("div", "vi-line");
    line.append(el("span", "vi", w.vi));
    const sp = el("button", "speak");
    sp.setAttribute("aria-label", "播放發音：" + w.vi);
    sp.innerHTML = SPEAK_ICON;
    sp.addEventListener("click", () => speak(w.vi));
    line.append(sp);
    word.append(line, el("div", "pos", `${w.pos} ${w.zh}`));
    row.append(word);

    const ex = el("div", "ex");
    ex.append(el("span", "ev", w.ex.vi), el("span", "ez", w.ex.zh));
    row.append(ex);

    list.append(row);
  });

  $("total").textContent = `共 ${all.length} 個單字`;
  renderPager(pages);
}

/* ================= 渲染：分頁 ================= */
function renderPager(pages) {
  const box = $("pages"); box.innerHTML = "";
  const prev = el("button", null, "‹");
  prev.disabled = state.page <= 1;
  prev.addEventListener("click", () => { state.page--; renderAll(); });
  box.append(prev);
  for (let p = 1; p <= pages; p++) {
    const b = el("button", null, String(p));
    b.setAttribute("aria-current", String(p === state.page));
    b.addEventListener("click", () => { state.page = p; renderAll(); });
    box.append(b);
  }
  const next = el("button", null, "›");
  next.disabled = state.page >= pages;
  next.addEventListener("click", () => { state.page++; renderAll(); });
  box.append(next);
}

function renderAll() {
  renderSide();
  renderHead();
  renderList();
}

/* ================= 事件 ================= */
$("q").addEventListener("input", e => { state.kw = e.target.value; state.page = 1; renderList(); });
$("size").addEventListener("change", e => { state.size = Number(e.target.value); state.page = 1; renderList(); });
renderAll();
</script>
</body>
</html>
