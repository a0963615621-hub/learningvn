<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>單字區｜越南語學習室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --green:#1F4A3D; --green-2:#2F6B58; --cream:#F6F2E8; --paper:#FBF8F1;
  --ink:#1E2B26; --muted:#5B6B63; --gold:#D8A93A; --line:rgba(31,74,61,.14);
  --sage:#DCE8DE; --peach:#F4E6D2; --mint:#D6E9E3;
  --serif:"Noto Serif TC",Georgia,serif; --sans:"Noto Sans TC","Be Vietnam Pro",system-ui,sans-serif;
  --viet:"Be Vietnam Pro","Noto Sans TC",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);line-height:1.7;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit;text-decoration:none}
button{font:inherit}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}

/* 頂部導覽（與首頁一致） */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;
  gap:16px;padding:14px clamp(18px,4vw,56px);background:rgba(251,248,241,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand strong{display:block;font-family:var(--serif);font-size:1.15rem;color:var(--green);line-height:1.2}
.brand small{display:block;font-size:.72rem;color:var(--muted);letter-spacing:.06em}
nav.menu{display:flex;gap:6px;flex-wrap:wrap}
nav.menu a{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;font-size:.95rem;color:var(--ink);position:relative}
nav.menu a svg{width:18px;height:18px;flex:none}
nav.menu a:hover{background:rgba(31,74,61,.06)}
nav.menu a[aria-current="page"]{color:var(--green);font-weight:500}
nav.menu a[aria-current="page"]::after{content:"";position:absolute;left:12px;right:12px;bottom:-4px;height:2px;background:var(--green)}

/* 頁首 */
.wrap{max-width:1040px;margin:0 auto;padding:40px clamp(18px,4vw,40px) 64px}
.page-head h1{font-family:var(--serif);font-size:clamp(1.9rem,4vw,2.6rem);color:var(--green);margin:0 0 8px;line-height:1.25}
.page-head p{margin:0;color:var(--muted);max-width:60ch}

/* 篩選與搜尋 */
.tools{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:30px 0 8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--paper);color:var(--muted);padding:7px 16px;border-radius:999px;cursor:pointer;font-size:.95rem;transition:background .2s,color .2s}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--cream)}
.search{width:min(300px,100%);font:inherit;font-size:.98rem;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink)}
.count{font-size:.9rem;color:var(--muted);margin:14px 0 18px}

/* 單字卡片 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{border-radius:18px;padding:20px 20px 18px;box-shadow:0 10px 24px rgba(31,74,61,.06);display:flex;flex-direction:column;gap:6px}
.card.greet{background:var(--sage)}.card.food{background:var(--peach)}.card.transport{background:var(--mint)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.vi{font-family:var(--viet);font-size:1.4rem;font-weight:600;color:var(--green);line-height:1.3}
.zh{font-size:1.02rem;color:var(--ink)}
.speak{flex:none;width:38px;height:38px;border-radius:50%;border:0;background:var(--green);color:var(--cream);cursor:pointer;display:grid;place-items:center}
.speak svg{width:18px;height:18px}
.speak:hover{background:var(--green-2)}
.speak[hidden]{display:none}
.tag{align-self:flex-start;font-size:.78rem;color:var(--muted);background:rgba(255,255,255,.6);padding:2px 10px;border-radius:999px}
.col{font-size:.92rem;color:var(--muted);margin:4px 0 0}
.ex{margin:8px 0 0;padding-top:10px;border-top:1px solid rgba(31,74,61,.12);font-size:.95rem}
.ex .ev{font-family:var(--viet);color:var(--ink)}
.ex .ez{display:block;color:var(--muted);font-size:.9rem}
.empty{color:var(--muted);padding:30px 0}

footer{border-top:1px solid var(--line);padding:24px clamp(18px,4vw,40px);text-align:center;color:var(--muted);font-size:.88rem}
footer a{color:var(--green)}

@media (max-width:640px){
  .top{justify-content:center}
  nav.menu{width:100%;justify-content:space-between}
  nav.menu a{padding:6px 8px;font-size:.88rem}
}
</style>
</head>
<body>

<header class="top">
  <a class="brand" href="index.html" aria-label="越南語學習室首頁">
    <svg width="38" height="38" viewBox="0 0 40 40" aria-hidden="true">
      <path d="M20 4c-4 6-9 10-10 18 3 0 6 2 10 6 4-4 7-6 10-6-1-8-6-12-10-18z" fill="#D8A93A"/>
      <path d="M20 14c-2 4-5 7-6 12 2 0 4 1 6 3 2-2 4-3 6-3-1-5-4-8-6-12z" fill="#1F4A3D"/>
      <path d="M4 30c6-2 10 0 16 4 6-4 10-6 16-4-6 4-10 6-16 2-6 4-10 2-16-2z" fill="#2F6B58"/>
    </svg>
    <span><strong>越南語學習室</strong><small>Học tiếng Việt</small></span>
  </a>
  <nav class="menu" aria-label="主選單">
    <a href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>首頁
    </a>
    <a href="vocab.html" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2zM22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"/></svg>單字區
    </a>
    <a href="dialogue.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12z"/></svg>對話區
    </a>
    <a href="reading.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>閱讀區
    </a>
  </nav>
</header>

<main class="wrap">
  <div class="page-head">
    <h1>單字區</h1>
    <p>從生活主題開始，每個單字都附上中文意思、常見搭配與例句。點擊喇叭可以聽發音。</p>
  </div>

  <div class="tools">
    <div class="chips" id="chips" role="group" aria-label="分類篩選"></div>
    <input class="search" id="q" type="search" placeholder="搜尋越南文或中文" aria-label="搜尋單字">
  </div>
  <div class="count" id="count" aria-live="polite"></div>
  <div class="grid" id="grid"></div>
</main>

<footer>
  <a href="index.html">回到首頁</a>
</footer>

<script>
/* ---------- 單字資料：新增單字只需在這裡加一筆 ---------- */
const CATEGORIES = [
  { id: "greet", name: "打招呼" },
  { id: "food", name: "飲食" },
  { id: "transport", name: "交通" }
];

const WORDS = [
  // 打招呼
  { cat: "greet", vi: "xin chào", zh: "你好", note: "最通用的問候，可用於任何時間。", col: ["xin chào anh（對男性）", "xin chào chị（對年長女性）"], ex: { vi: "Xin chào, bạn khỏe không?", zh: "你好，你還好嗎？" } },
  { cat: "greet", vi: "cảm ơn", zh: "謝謝", note: "日常最常用的感謝說法。", col: ["cảm ơn bạn", "cảm ơn rất nhiều"], ex: { vi: "Cảm ơn bạn đã giúp tôi.", zh: "謝謝你幫我。" } },
  { cat: "greet", vi: "không có gì", zh: "不客氣", note: "回應「謝謝」時使用。", col: ["không có gì đâu"], ex: { vi: "Cảm ơn bạn! — Không có gì.", zh: "謝謝你！——不客氣。" } },
  { cat: "greet", vi: "xin lỗi", zh: "對不起、抱歉", note: "道歉或請求對方注意時使用。", col: ["xin lỗi bạn", "xin lỗi vì…"], ex: { vi: "Xin lỗi, tôi đến muộn.", zh: "對不起，我來晚了。" } },
  { cat: "greet", vi: "làm ơn", zh: "請、麻煩你", note: "在請求別人幫忙時放在句首或句尾。", col: ["làm ơn giúp tôi"], ex: { vi: "Làm ơn cho tôi một ly nước.", zh: "麻煩給我一杯水。" } },
  { cat: "greet", vi: "chào buổi sáng", zh: "早安", note: "buổi sáng 指早上；下午用 chào buổi chiều。", col: ["chào buổi tối（晚安／晚上好）"], ex: { vi: "Chào buổi sáng, anh khỏe không?", zh: "早安，你好嗎？" } },
  { cat: "greet", vi: "rất vui được gặp bạn", zh: "很高興認識你", note: "初次見面時的常用句。", col: ["rất vui được làm quen"], ex: { vi: "Rất vui được gặp bạn.", zh: "很高興認識你。" } },
  { cat: "greet", vi: "hẹn gặp lại", zh: "再見、回頭見", note: "字面意思是「約定再見」，語氣比 tạm biệt 親切。", col: ["hẹn gặp lại sau"], ex: { vi: "Hẹn gặp lại bạn vào tuần sau.", zh: "下週見。" } },
  { cat: "greet", vi: "tạm biệt", zh: "再見", note: "比較中性的告別用語。", col: ["nói tạm biệt"], ex: { vi: "Tạm biệt, hẹn gặp lại!", zh: "再見，下次見！" } },

  // 飲食
  { cat: "food", vi: "cơm", zh: "飯", note: "越南人的主食。cơm trắng 指白飯。", col: ["cơm trắng（白飯）", "ăn cơm（吃飯）"], ex: { vi: "Tôi ăn cơm mỗi ngày.", zh: "我每天吃飯。" } },
  { cat: "food", vi: "phở", zh: "河粉", note: "越南的代表性湯麵，常見於早餐。", col: ["phở bò（牛肉河粉）", "phở gà（雞肉河粉）"], ex: { vi: "Sáng nay tôi ăn phở.", zh: "我今天早上吃了河粉。" } },
  { cat: "food", vi: "bánh mì", zh: "越式法國麵包", note: "外皮酥脆的麵包，可夾各種餡料。", col: ["bánh mì thịt（肉鬆麵包）"], ex: { vi: "Bánh mì này rất ngon.", zh: "這個法國麵包很好吃。" } },
  { cat: "food", vi: "cà phê sữa đá", zh: "越式冰奶咖啡", note: "sữa 是牛奶，đá 是冰塊。", col: ["cà phê đen（黑咖啡）"], ex: { vi: "Cho tôi một ly cà phê sữa đá.", zh: "請給我一杯冰奶咖啡。" } },
  { cat: "food", vi: "thịt", zh: "肉", note: "需搭配種類使用，例如 thịt bò 牛肉。", col: ["thịt bò（牛肉）", "thịt heo／thịt lợn（豬肉）", "thịt gà（雞肉）"], ex: { vi: "Tôi không ăn thịt bò.", zh: "我不吃牛肉。" } },
  { cat: "food", vi: "cá", zh: "魚", note: "泛指魚類。", col: ["cá kho（燉魚）"], ex: { vi: "Cá này tươi quá.", zh: "這魚好新鮮。" } },
  { cat: "food", vi: "rau", zh: "蔬菜", note: "越南料理常搭配大量生菜與香草。", col: ["rau sống（生菜）"], ex: { vi: "Ăn nhiều rau rất tốt.", zh: "多吃蔬菜很好。" } },
  { cat: "food", vi: "trái cây", zh: "水果", note: "trái 是果實，cây 是樹。", col: ["ăn trái cây（吃水果）"], ex: { vi: "Tôi thích trái cây nhiệt đới.", zh: "我喜歡熱帶水果。" } },
  { cat: "food", vi: "ngon", zh: "好吃", note: "形容詞，用來評價食物。", col: ["ngon quá（好好吃）", "rất ngon（很好吃）"], ex: { vi: "Món này ngon quá!", zh: "這道菜好好吃！" } },
  { cat: "food", vi: "cay", zh: "辣", note: "形容詞。注意：越南語的「辣」和「苦」不同。", col: ["không cay（不辣）", "cay quá（好辣）"], ex: { vi: "Đồ ăn này hơi cay.", zh: "這道菜有點辣。" } },

  // 交通
  { cat: "transport", vi: "xe buýt", zh: "公車", note: "城市裡常見的大眾運輸。", col: ["bắt xe buýt（搭公車）", "trạm xe buýt（公車站）"], ex: { vi: "Tôi đi làm bằng xe buýt.", zh: "我搭公車上班。" } },
  { cat: "transport", vi: "xe máy", zh: "機車、摩托車", note: "越南最普遍的交通工具。", col: ["đi xe máy（騎機車）"], ex: { vi: "Ở đây ai cũng đi xe máy.", zh: "這裡每個人都騎機車。" } },
  { cat: "transport", vi: "xe đạp", zh: "腳踏車", note: "動詞用 đạp xe（騎腳踏車）。", col: ["đi xe đạp（騎腳踏車）"], ex: { vi: "Tôi thích đi xe đạp buổi sáng.", zh: "我喜歡早上騎腳踏車。" } },
  { cat: "transport", vi: "tàu hỏa", zh: "火車", note: "長途移動常用。", col: ["ga tàu hỏa（火車站）", "vé tàu（火車票）"], ex: { vi: "Tàu hỏa đến lúc mấy giờ?", zh: "火車幾點到？" } },
  { cat: "transport", vi: "máy bay", zh: "飛機", note: "sân bay 是機場。", col: ["đi máy bay（搭飛機）", "sân bay（機場）"], ex: { vi: "Chuyến máy bay này bay đi đâu?", zh: "這班飛機飛去哪裡？" } },
  { cat: "transport", vi: "bến xe", zh: "客運站、車站", note: "長途客運的停靠地點。", col: ["bến xe buýt（公車總站）"], ex: { vi: "Bến xe ở đâu?", zh: "客運站在哪裡？" } },
  { cat: "transport", vi: "đường", zh: "路、街道", note: "泛指道路；具體的街名前會加 đường。", col: ["đường lớn（大馬路）", "qua đường（過馬路）"], ex: { vi: "Đường này đi đâu?", zh: "這條路通往哪裡？" } },
  { cat: "transport", vi: "đèn đỏ", zh: "紅燈", note: "đèn 是燈，đỏ 是紅色。", col: ["đèn xanh（綠燈）", "đèn vàng（黃燈）"], ex: { vi: "Đèn đỏ rồi, dừng lại đi.", zh: "紅燈了，停下來。" } },
  { cat: "transport", vi: "vé", zh: "票", note: "買票用 mua vé。", col: ["mua vé（買票）", "giá vé（票價）"], ex: { vi: "Tôi muốn mua một vé.", zh: "我想買一張票。" } },
  { cat: "transport", vi: "đi bộ", zh: "步行", note: "動詞短語，字面是「走路」。", col: ["đi bộ đến trường（走路去學校）"], ex: { vi: "Tôi thích đi bộ trong công viên.", zh: "我喜歡在公園散步。" } }
];

/* ---------- 發音（瀏覽器支援時才顯示按鈕） ---------- */
const canSpeak = "speechSynthesis" in window;
function speak(text) {
  if (!canSpeak) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "vi-VN";
  u.rate = 0.9;
  speechSynthesis.speak(u);
}

/* ---------- 篩選與渲染 ---------- */
let activeCat = "all";
let keyword = "";
const chipsEl = document.getElementById("chips");
const gridEl = document.getElementById("grid");
const countEl = document.getElementById("count");
const qEl = document.getElementById("q");

const catName = id => (CATEGORIES.find(c => c.id === id) || {}).name || "";

function renderChips() {
  chipsEl.innerHTML = "";
  [{ id: "all", name: "全部" }, ...CATEGORIES].forEach(c => {
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = c.name;
    b.setAttribute("aria-pressed", String(activeCat === c.id));
    b.addEventListener("click", () => { activeCat = c.id; renderChips(); renderGrid(); });
    chipsEl.append(b);
  });
}

function renderGrid() {
  const kw = keyword.trim().toLowerCase();
  const list = WORDS.filter(w =>
    (activeCat === "all" || w.cat === activeCat) &&
    (!kw || (w.vi + " " + w.zh + " " + w.note).toLowerCase().includes(kw))
  );
  gridEl.innerHTML = "";
  countEl.textContent = `共 ${list.length} 個單字`;
  if (!list.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "找不到符合的單字，換個關鍵字試試。";
    gridEl.append(p);
    return;
  }
  list.forEach(w => {
    const card = document.createElement("article");
    card.className = "card " + w.cat;

    const head = document.createElement("div");
    head.className = "card-head";
    const titles = document.createElement("div");
    const vi = document.createElement("div"); vi.className = "vi"; vi.textContent = w.vi;
    const zh = document.createElement("div"); zh.className = "zh"; zh.textContent = w.zh;
    titles.append(vi, zh);
    head.append(titles);

    if (canSpeak) {
      const sp = document.createElement("button");
      sp.className = "speak";
      sp.setAttribute("aria-label", "播放發音：" + w.vi);
      sp.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>';
      sp.addEventListener("click", () => speak(w.vi));
      head.append(sp);
    }
    card.append(head);

    const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = catName(w.cat);
    card.append(tag);

    const note = document.createElement("p"); note.className = "col"; note.textContent = w.note;
    card.append(note);

    if (w.col && w.col.length) {
      const col = document.createElement("p"); col.className = "col";
      col.textContent = "常見搭配：" + w.col.join("、");
      card.append(col);
    }

    const ex = document.createElement("div"); ex.className = "ex";
    const ev = document.createElement("span"); ev.className = "ev"; ev.textContent = w.ex.vi;
    const ez = document.createElement("span"); ez.className = "ez"; ez.textContent = w.ex.zh;
    ex.append(ev, ez);
    card.append(ex);

    gridEl.append(card);
  });
}

qEl.addEventListener("input", () => { keyword = qEl.value; renderGrid(); });
renderChips();
renderGrid();
</script>
</body>
</html>
